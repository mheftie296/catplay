name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the CI image
        run: docker build --file Dockerfile.ci --tag catplay-ci .

      - name: Build the workspace
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            catplay-ci \
            cargo build --workspace
